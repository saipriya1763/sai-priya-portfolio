<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Sai Priya — Full-Stack Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            padding: 5rem 1rem;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #5eead4;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .skill-item {
            background: #1e293b;
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
        }
        .skill-bar {
            background: #334155;
            height: 10px;
            border-radius: 5px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .skill-fill {
            height: 100%;
            width: 0;
            background: #5eead4;
            transition: width 1s ease-in-out;
        }
    </style>
</head>
<body>

    <header class="reveal">
        <h1>N Sai Priya</h1>
        <p>Full-Stack Developer</p>
    </header>

    <div class="container">
        <section class="reveal" style="margin-bottom: 3rem;">
            <h2>About Me</h2>
            <p style="margin-top: 1rem;">Welcome to my portfolio! I am a passionate developer skilled in building interactive web experiences.</p>
        </section>

        <section class="reveal">
            <h2>Skills</h2>
            <div class="skill-item" style="margin-top: 1rem;">
                <span>JavaScript / Frontend</span>
                <div class="skill-bar">
                    <div class="skill-fill" data-width="85"></div>
                </div>
            </div>
            <div class="skill-item">
                <span>Problem Solving</span>
                <div class="skill-bar">
                    <div class="skill-fill" data-width="90"></div>
                </div>
            </div>
        </section>
        
        <div id="marqueeTrack" style="margin-top: 3rem; white-space: nowrap; overflow: hidden;">
            <span>✨ Passionate Developer &nbsp;&bull;&nbsp; Open to Opportunities &nbsp;&bull;&nbsp; </span>
        </div>
    </div>

    <canvas id="particleCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-1;"></canvas>

    <script>
        // ===== PARTICLE BACKGROUND EFFECT =====
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for(let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < 0) p.x = canvas.width;
                if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height;
                if(p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(94,234,212,0.7)';
                ctx.fill();
            });

            for(let i=0; i<particles.length; i++){
                for(let j=i+1; j<particles.length; j++){
                    const a = particles[i], b = particles[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 130){
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(139,124,246,${0.18 * (1 - dist/130)})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // ===== SCROLL REVEAL (IntersectionObserver) =====
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // ===== SKILL BARS ON SCROLL =====
        const skillObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    const fill = entry.target.querySelector('.skill-fill');
                    if(fill){
                        fill.style.width = fill.getAttribute('data-width') + '%';
                    }
                    skillObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.4 });

        document.querySelectorAll('.skill-item').forEach(el => skillObserver.observe(el));

        // ===== MARQUEE DUPLICATE (for seamless infinite loop) =====
        const track = document.getElementById('marqueeTrack');
        if (track) {
            track.innerHTML += track.innerHTML;
        }
    </script>
</body>
</html>
